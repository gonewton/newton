name: Auto Release

# Triggers on every push to main (excluding pure doc/workflow changes) and
# cuts a new patch release by:
#   1. Computing the next UNUSED patch version — derived from the last tag,
#      never below Cargo.toml, and advanced past any tag that already exists —
#      so releases fire on every merge without a manual bump and a published
#      version is never re-cut or force-moved (tags are immutable).
#   2. Creating an auto-release branch, bumping Cargo.toml, and opening a PR.
#   3. Enabling squash auto-merge so required checks gate the release PR. The
#      merge commit carries "[skip release]" so bringing the bump home does NOT
#      start another version-bump PR.
#   4. On the resulting release commit, tagging that exact commit and pushing
#      the immutable tag. The tag triggers the Release workflow.
#
# History note: this workflow was previously stuck — the release PR was a
# DRAFT that never merged, so main's Cargo.toml froze, `git describe` never
# advanced past the last reachable tag, and the guard re-derived the same
# version on every merge and force-moved its tag. Steps 3 + the tag-immutability
# logic in step 1 fix that.
#
# Escape hatch: include "[skip release]" in a normal commit message to suppress.
# Release commits are also recognized by their conventional subject so a
# manually completed release PR cannot cascade into another release PR.
#
# Concurrency: at most one auto-release run at a time on main; later pushes
# cancel in-progress runs so versions don't collide.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'

concurrency:
  group: auto-release-main
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip release]') &&
       !startsWith(github.event.head_commit.message, 'chore: release v'))
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: gonewton

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next version from last tag
        id: next-version
        run: |
          # Derive the next patch release from the most recent reachable tag so
          # every merge to main triggers a release — no manual version bump needed.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LAST_VERSION=${LAST_TAG#v}
          IFS='.' read -r major minor patch <<< "$LAST_VERSION"
          NEXT_PATCH=$((patch + 1))
          NEXT_VERSION="$major.$minor.$NEXT_PATCH"

          # Guard: if Cargo.toml is already at or ahead of the tag-derived version
          # (e.g. a prior auto-release PR was merged without a matching tag), advance
          # past the Cargo.toml version so the version bump is never a no-op.
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          IFS='.' read -r cmaj cmin cpatch <<< "$CARGO_VERSION"
          if [ "$cmaj" = "$major" ] && [ "$cmin" = "$minor" ] && [ "$cpatch" -ge "$NEXT_PATCH" ]; then
            NEXT_PATCH=$((cpatch + 1))
            NEXT_VERSION="$major.$minor.$NEXT_PATCH"
            echo "Cargo.toml already at $CARGO_VERSION — advancing to $NEXT_VERSION"
          fi

          # Tag immutability: never re-cut or force-move a version that already
          # has a tag. Advance to the next unused patch. This also self-heals
          # past any orphaned tag left by the previous (stuck) workflow, whose
          # tags could point at commits never merged to main.
          while git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; do
            echo "Tag v$NEXT_VERSION already exists — advancing to the next unused version"
            NEXT_PATCH=$((NEXT_PATCH + 1))
            NEXT_VERSION="$major.$minor.$NEXT_PATCH"
          done

          echo "last_tag=$LAST_TAG"
          echo "cargo_version=$CARGO_VERSION"
          echo "next_version=$NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch_name=auto-release-$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        id: create-branch
        run: |
          BRANCH_NAME="${{ steps.next-version.outputs.branch_name }}"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Clean up any stale branch from a previous concurrent run.
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Remote branch $BRANCH_NAME exists, deleting it..."
            git push origin --delete "$BRANCH_NAME" || true
          fi
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            git branch -D "$BRANCH_NAME" || true
          fi

          git checkout -b "$BRANCH_NAME"

      - name: Set version in Cargo.toml
        run: |
          CURRENT_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          NEXT_VERSION="${{ steps.next-version.outputs.next_version }}"
          sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEXT_VERSION\"/" Cargo.toml
          echo "Bumped Cargo.toml: $CURRENT_VERSION → $NEXT_VERSION"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94

      - name: Regenerate OpenAPI spec
        run: ./scripts/generate-openapi.sh

      - name: Commit version bump
        run: |
          NEXT_VERSION="${{ steps.next-version.outputs.next_version }}"
          git add Cargo.toml Cargo.lock openapi/newton-api.yaml
          if git diff --cached --quiet; then
            echo "::error::Nothing staged after version bump to $NEXT_VERSION — Cargo.toml may already be at this version. Investigate version/tag drift."
            exit 1
          fi
          git commit -m "chore: bump version to $NEXT_VERSION"

      - name: Push release branch
        run: |
          git push --force-with-lease origin "${{ steps.next-version.outputs.branch_name }}"

      - name: Create release PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          NEXT_VERSION="${{ steps.next-version.outputs.next_version }}"
          BRANCH_NAME="${{ steps.next-version.outputs.branch_name }}"
          PR_TITLE="chore: release v$NEXT_VERSION"

          # Write body to a file so that COMMIT_MSG (which may contain backticks,
          # dollar signs, or other shell metacharacters from a prior squash-merge)
          # is never re-interpreted by bash.
          # shellcheck disable=SC2016
          printf 'Automated release for version %s\n\nCreated and squash-merged by the auto-release workflow to bring the\nversion bump into `main`.\n\n**What triggered this release:**\nCommit: %s\nMessage: %s\n' \
            "$NEXT_VERSION" "$COMMIT_SHA" "$COMMIT_MSG" > /tmp/pr_body.md

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file /tmp/pr_body.md
            PR_NUMBER="$EXISTING_PR"
          else
            echo "Creating PR for $BRANCH_NAME..."
            gh pr create \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.md \
              --base main \
              --head "$BRANCH_NAME" \
              --label "auto-release"
            PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')
          fi

          echo "pr_number=$PR_NUMBER"

          # Let branch protection decide when the PR is ready. Auto-merge waits
          # for every required check instead of racing them with a short retry
          # loop. The release-subject guard above is a second line of defense if
          # this PR is ever completed manually without the skip marker.
          MERGE_SUBJECT="$PR_TITLE (#$PR_NUMBER) [skip release]"
          MERGE_BODY="Automated version bump for v$NEXT_VERSION. Triggered by $COMMIT_SHA."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch \
            --match-head-commit "$(git rev-parse HEAD)" \
            --subject "$MERGE_SUBJECT" --body "$MERGE_BODY"
          echo "Auto-merge enabled for release PR #$PR_NUMBER"

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore: release v')
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: gonewton

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag release commit (triggers Release workflow)
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG="v$VERSION"
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA")

          case "$SUBJECT" in
            "chore: release $TAG"*) ;;
            *)
              echo "::error::Release subject '$SUBJECT' does not match Cargo.toml version $VERSION"
              exit 1
              ;;
          esac

          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"

          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" = "$GITHUB_SHA" ]; then
              echo "$TAG already points to $GITHUB_SHA"
              exit 0
            fi
            echo "::error::Tag $TAG already points to $REMOTE_TAG_SHA — refusing to move it"
            exit 1
          fi

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Tagged $TAG at $GITHUB_SHA"

  cleanup-old-releases:
    name: Cleanup Old Release Branches
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: gonewton

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Delete merged release branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Cleaning up old auto-release branches..."

          RELEASE_BRANCHES=$(git branch -r | grep 'origin/auto-release-' | sed 's|origin/||' || true)

          if [ -z "$RELEASE_BRANCHES" ]; then
            echo "No auto-release branches found to clean up"
            exit 0
          fi

          for BRANCH in $RELEASE_BRANCHES; do
            echo "Checking branch: $BRANCH"
            PR_STATE=$(gh pr list --head "$BRANCH" --state all --json state,mergedAt --jq '.[0] | select(.mergedAt != null) | .state' || echo "")

            if [ "$PR_STATE" = "MERGED" ]; then
              echo "PR for $BRANCH is merged, deleting branch..."
              git push origin --delete "$BRANCH" || echo "Failed to delete $BRANCH (may already be deleted)"
            else
              BRANCH_AGE=$(git log -1 --format=%ct "origin/$BRANCH" 2>/dev/null || echo "0")
              CURRENT_TIME=$(date +%s)
              AGE_DAYS=$(( (CURRENT_TIME - BRANCH_AGE) / 86400 ))
              if [ "$AGE_DAYS" -gt 7 ]; then
                PR_EXISTS=$(gh pr list --head "$BRANCH" --state all --json number --jq '.[0].number' || echo "")
                if [ -z "$PR_EXISTS" ]; then
                  echo "Branch $BRANCH is $AGE_DAYS days old with no PR, deleting..."
                  git push origin --delete "$BRANCH" || echo "Failed to delete $BRANCH"
                fi
              fi
            fi
          done

          echo "Cleanup complete"
