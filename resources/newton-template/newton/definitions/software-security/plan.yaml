version: '2.0'
mode: workflow_graph
workflow:
  settings:
    entry_task: plan
    io:
      result_map:
        decision: execute
        proposal_id: '$expr: triggers.candidate_id + "-dependency-security"'
        rationale: remediate the highest-value dependency security issue
        attempt: {kind: dependency_security_remediation}
        selected_observations: []
        plan: {kind: agent_remediation}
  tasks:
    - id: plan
      operator: NoOpOperator
      terminal: success
