version: '2.0'
mode: workflow_graph
workflow:
  settings:
    entry_task: swap
    io:
      result_map:
        candidate: '$expr: tasks.develop.output.patch.candidate'
  tasks:
    - id: swap
      operator: AgentOperator
      params:
        engine: command
        signals: {completed: '^TRANSIENT_SWAP_COMPLETED$'}
        require_signal: true
        engine_command:
          - python3
          - -c
          - {$expr: 'triggers.assets["transient-swap.py"]'}
          - {$expr: triggers.state_dir}
          - {$expr: triggers.run_id}
      transitions:
        - to: develop
    - id: develop
      operator: SetContextOperator
      params:
        patch:
          candidate:
            id: {$expr: triggers.candidate_id}
            artifact_id: better
            base_artifact_id: original
            created_under_revision: {$expr: triggers.requirements_revision}
      terminal: success
