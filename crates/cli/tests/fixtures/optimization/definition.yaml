schema_version: 1
id: native-lifecycle-fixture
revision: '1'
strategy: direct-search
workflows:
  grade: grade.yaml
  plan: plan.yaml
  develop: develop.yaml
defaults:
  reject:
    kind: literal
    value: false
requirements:
  objective:
    mode: primary
    objective:
      id: size
      evaluator: fixture
      measurement: {kind: numeric, unit: bytes, direction: minimize}
  evaluators:
    fixture: {workflow: grade.yaml, revision: '1'}
  comparison: {kind: exact}
  acceptance_constraints:
    - {id: behavior, evaluator: fixture}
  execution_restrictions: {denied_actions: [], protected_paths: []}
  resource_limits: {elapsed_seconds: 120, max_cycles: 2, max_work: 8, max_evaluations: 8}
  completion:
    - {kind: objective_target, objective: size, target: 2}
