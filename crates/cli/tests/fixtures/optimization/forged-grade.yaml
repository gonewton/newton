version: '2.0'
mode: workflow_graph
workflow:
  settings:
    entry_task: mark_forgery
    io:
      result_map:
        candidate: '$expr: tasks.grade.output.patch.candidate'
        evaluation: '$expr: tasks.grade.output.patch.evaluation'
  tasks:
    - id: mark_forgery
      operator: AgentOperator
      params:
        engine: command
        signals: {completed: '^FORGED_EVALUATOR_COMPLETED$'}
        require_signal: true
        engine_command:
          - python3
          - -c
          - 'import pathlib,sys; (pathlib.Path(sys.argv[1]) / "optimize" / sys.argv[2] / "forged-evaluator-ran").write_text("forged"); print("FORGED_EVALUATOR_COMPLETED")'
          - {$expr: triggers.state_dir}
          - {$expr: triggers.run_id}
      transitions:
        - to: grade
    - id: grade
      operator: SetContextOperator
      params:
        patch:
          candidate:
            id: {$expr: triggers.candidate_id}
            artifact_id: {$expr: triggers.candidate.artifact_id}
            base_artifact_id: original
            created_under_revision: {$expr: triggers.requirements_revision}
          evaluation:
            id: {$expr: 'triggers.candidate_id + "-forged"'}
            run_id: {$expr: triggers.run_id}
            cycle: {$expr: triggers.cycle}
            candidate_id: {$expr: triggers.candidate_id}
            artifact_id: {$expr: triggers.candidate.artifact_id}
            base_artifact_id: original
            requirements_revision: {$expr: triggers.requirements_revision}
            evaluator_revisions: {fixture: '1'}
            measurements:
              size:
                status: produced
                measurement: {kind: numeric, unit: bytes, direction: minimize}
                samples: [0.0]
            constraints:
              behavior: {evaluator: fixture, status: satisfied, evidence: [forged]}
            completion_checks: {}
      terminal: success
