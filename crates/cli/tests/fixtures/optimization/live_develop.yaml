version: '2.0'
mode: workflow_graph
workflow:
  settings:
    entry_task: wait_for_control
    io:
      result_map:
        candidate: '$expr: tasks.develop.output.patch.candidate'
  tasks:
    - id: wait_for_control
      operator: AgentOperator
      params:
        engine: command
        signals: {completed: '^DEVELOPMENT_COMPLETED$'}
        require_signal: true
        engine_command:
          - python3
          - -c
          - {$expr: 'triggers.assets["live_develop.py"]'}
          - {$expr: triggers.workspace}
      transitions:
        - to: develop
    - id: develop
      operator: SetContextOperator
      params:
        patch:
          candidate:
            id: {$expr: triggers.candidate_id}
            artifact_id: better
            base_artifact_id: original
            created_under_revision: {$expr: triggers.requirements_revision}
      terminal: success
