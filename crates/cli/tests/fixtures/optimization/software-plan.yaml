version: '2.0'
mode: workflow_graph
workflow:
  settings:
    entry_task: plan
    io:
      result_map:
        decision: propose
        plan_id: '$expr: if triggers.cycle == 1 { "plan-1" } else if triggers.cycle == 2 { "plan-2" } else { "plan-3" }'
        change_request_id: '$expr: triggers.change_request_id'
  tasks:
    - id: plan
      operator: NoOpOperator
      terminal: success
